<h2 mat-dialog-title>Nouvelle Réservation</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="flex flex-col gap-4 pt-2">
    <mat-form-field appearance="outline">
      <mat-label>ID Membre</mat-label>
      <input matInput type="number" formControlName="membreId" />
      <mat-error *ngIf="form.get('membreId')?.invalid"
        >Membre obligatoire</mat-error
      >
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>ID Terrain</mat-label>
      <input matInput type="number" formControlName="terrainId" />
      <mat-error *ngIf="form.get('terrainId')?.invalid"
        >Terrain obligatoire</mat-error
      >
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Date début</mat-label>
      <input matInput type="datetime-local" formControlName="dateDebut" />
      <mat-error *ngIf="form.get('dateDebut')?.invalid"
        >Date début obligatoire</mat-error
      >
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Date fin</mat-label>
      <input matInput type="datetime-local" formControlName="dateFin" />
      <mat-error *ngIf="form.get('dateFin')?.invalid"
        >Date fin obligatoire</mat-error
      >
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Prix (€)</mat-label>
      <input matInput type="number" formControlName="prix" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Statut</mat-label>
      <mat-select formControlName="statut">
        <mat-option value="EN_ATTENTE">En attente</mat-option>
        <mat-option value="CONFIRMEE">Confirmée</mat-option>
        <mat-option value="ANNULEE">Annulée</mat-option>
      </mat-select>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="annuler()">Annuler</button>
  <button mat-raised-button color="primary" (click)="confirmer()">Créer</button>
</mat-dialog-actions>
