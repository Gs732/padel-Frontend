<mat-toolbar color="primary">
  <span class="font-bold text-xl">🎾 Padel Manager</span>
  <span class="flex-1"></span>

  <!-- Visible par tous les utilisateurs connectés -->
  <a mat-button routerLink="/" routerLinkActive="active">Accueil</a>
  <a mat-button routerLink="/reservations" routerLinkActive="active">Réservations</a>

  <!-- Réservé aux administrateurs -->
  @if (authService.isAdmin()) {
    <a mat-button routerLink="/membres" routerLinkActive="active">Membres</a>
    <a mat-button routerLink="/terrains" routerLinkActive="active">Terrains</a>
  }

  <!-- Réservé à l'admin global (gestion des sites) -->
  @if (authService.isAdminGlobal()) {
    <a mat-button routerLink="/sites" routerLinkActive="active">Sites</a>
  }

  <!-- Bouton de déconnexion -->
  @if (authService.isLoggedIn()) {
    <a mat-button (click)="authService.logout()">Déconnexion</a>
  }
</mat-toolbar>
