<div class="p-4">
  <div class="flex justify-between items-center mb-4">
    <h1 class="text-2xl font-bold">Gestion des Réservations</h1>
    <button mat-raised-button color="primary" (click)="ouvrirDialog()">
      + Nouvelle réservation
    </button>
  </div>

  <table mat-table [dataSource]="reservations" class="w-full shadow">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let r">{{ r.id }}</td>
    </ng-container>

    <ng-container matColumnDef="membreId">
      <th mat-header-cell *matHeaderCellDef>Membre ID</th>
      <td mat-cell *matCellDef="let r">{{ r.membreId }}</td>
    </ng-container>

    <ng-container matColumnDef="terrainId">
      <th mat-header-cell *matHeaderCellDef>Terrain ID</th>
      <td mat-cell *matCellDef="let r">{{ r.terrainId }}</td>
    </ng-container>

    <ng-container matColumnDef="dateDebut">
      <th mat-header-cell *matHeaderCellDef>Date début</th>
      <td mat-cell *matCellDef="let r">
        {{ r.dateDebut | date: "dd/MM/yyyy HH:mm" }}
      </td>
    </ng-container>

    <ng-container matColumnDef="dateFin">
      <th mat-header-cell *matHeaderCellDef>Date fin</th>
      <td mat-cell *matCellDef="let r">
        {{ r.dateFin | date: "dd/MM/yyyy HH:mm" }}
      </td>
    </ng-container>

    <ng-container matColumnDef="prix">
      <th mat-header-cell *matHeaderCellDef>Prix</th>
      <td mat-cell *matCellDef="let r">{{ r.prix }} €</td>
    </ng-container>

    <ng-container matColumnDef="statut">
      <th mat-header-cell *matHeaderCellDef>Statut</th>
      <td mat-cell *matCellDef="let r">
        <span
          [ngClass]="{
            'text-green-600': r.statut === 'CONFIRMEE',
            'text-orange-600': r.statut === 'EN_ATTENTE',
            'text-red-600': r.statut === 'ANNULEE',
          }"
          >{{ r.statut }}</span
        >
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let r">
        <button
          mat-icon-button
          color="warn"
          (click)="annulerReservation(r.id)"
          [disabled]="r.statut === 'ANNULEE'"
        >
          <mat-icon>cancel</mat-icon>
        </button>
        <button
          mat-icon-button
          color="warn"
          (click)="supprimerReservation(r.id)"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
