<div class="p-4">
  <div class="flex justify-between items-center mb-4">
    <h1 class="text-2xl font-bold">Gestion des Terrains</h1>
    <button mat-raised-button color="primary" (click)="ouvrirDialog()">
      + Nouveau terrain
    </button>
  </div>

  <table mat-table [dataSource]="terrains" class="w-full shadow">

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let t">{{ t.id }}</td>
    </ng-container>

    <ng-container matColumnDef="nom">
      <th mat-header-cell *matHeaderCellDef>Nom</th>
      <td mat-cell *matCellDef="let t">{{ t.nom }}</td>
    </ng-container>

    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef>Type</th>
      <td mat-cell *matCellDef="let t">{{ t.type }}</td>
    </ng-container>

    <ng-container matColumnDef="interieur">
      <th mat-header-cell *matHeaderCellDef>Intérieur</th>
      <td mat-cell *matCellDef="let t">
        <span [class]="t.interieur ? 'text-blue-600' : 'text-orange-600'">
          {{ t.interieur ? 'Oui' : 'Non' }}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="actif">
      <th mat-header-cell *matHeaderCellDef>Actif</th>
      <td mat-cell *matCellDef="let t">
        <span [class]="t.actif ? 'text-green-600' : 'text-red-600'">
          {{ t.actif ? 'Oui' : 'Non' }}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="siteId">
      <th mat-header-cell *matHeaderCellDef>Site ID</th>
      <td mat-cell *matCellDef="let t">{{ t.siteId }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let t">
        <button mat-icon-button color="warn" (click)="supprimerTerrain(t.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>
</div>
